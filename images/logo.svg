<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 72" width="280" height="72">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="50%" stop-color="#F3B01C"/>
      <stop offset="100%" stop-color="#E86A17"/>
    </linearGradient>
    <linearGradient id="flameGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#C1272D"/>
      <stop offset="60%" stop-color="#E86A17"/>
      <stop offset="100%" stop-color="#F3B01C"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#2A0E0C" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Icon Badge -->
  <g transform="translate(6, 6)" filter="url(#glow)">
    <!-- Outer Seal -->
    <rect x="0" y="0" width="60" height="60" rx="18" fill="#2A0E0C" stroke="#F3B01C" stroke-width="2.5"/>
    
    <!-- Warm Cloche & Heart / Flame -->
    <!-- Cloche dome -->
    <path d="M15 36 C15 22, 45 22, 45 36 Z" fill="url(#logoGrad)"/>
    <!-- Cloche knob -->
    <circle cx="30" cy="20" r="3.5" fill="#FFE082"/>
    <!-- Cloche base plate -->
    <rect x="12" y="38" width="36" height="4" rx="2" fill="#FFE082"/>
    <!-- Love flame in center -->
    <path d="M30 26 C33 22, 38 24, 38 27 C38 31, 30 35, 30 35 C30 35, 22 31, 22 27 C22 24, 27 22, 30 26 Z" fill="url(#flameGrad)"/>
  </g>

  <!-- Typography -->
  <text x="80" y="36" font-family="'Plus Jakarta Sans', 'Outfit', 'Segoe UI', sans-serif" font-size="25" font-weight="900" fill="#2A0E0C" letter-spacing="-0.5">DAPUR <tspan fill="#C1272D">PASUTRI</tspan></text>
  <text x="81" y="54" font-family="'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="10.5" font-weight="700" fill="#E86A17" letter-spacing="1.2">CITA RASA RUMAHAN SEJAK 2021</text>
</svg>
