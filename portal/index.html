<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Portal Team — Dapur Pasutri</title>
  <link rel="stylesheet" href="css/admin.css">
  <style>
    .admin-container { max-width: 980px; margin: 20px auto; }
    .product-table { width: 100%; border-collapse: collapse; margin-top: 24px; background: #fff; border-radius: 12px; overflow: hidden; border: 1px solid var(--border); }
    .product-table th, .product-table td { padding: 14px 18px; text-align: left; border-bottom: 1px solid var(--border); }
    .product-table th { background: #fdfaf5; font-size: 0.85rem; text-transform: uppercase; color: var(--oxblood); }
    .product-thumb { width: 48px; height: 48px; border-radius: 6px; object-fit: cover; }
    .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
  </style>
</head>
<body>
  <div class="admin-container">
    <div class="top-bar">
      <div>
        <h1>Portal Team Dapur Pasutri</h1>
        <p style="color:var(--ink-soft)">Kelola katalog menu, harga, dan varian Stick Kentang</p>
      </div>
      <div>
        <a href="../" class="btn btn-primary" style="width:auto;">&larr; Lihat Website</a>
      </div>
    </div>

    <div class="card">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <h2>Daftar Produk Aktif</h2>
        <span class="badge-tag" id="product-count">0 Produk</span>
      </div>

      <div style="overflow-x:auto;">
        <table class="product-table">
          <thead>
            <tr>
              <th>Foto</th>
              <th>Nama Produk</th>
              <th>Kategori</th>
              <th>Harga</th>
              <th>Featured</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody id="product-tbody">
            <tr><td colspan="6" style="text-align:center;">Memuat data produk...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    async function loadProducts() {
      try {
        const res = await fetch('../data/products.json');
        const data = await res.json();
        const tbody = document.getElementById('product-tbody');
        document.getElementById('product-count').textContent = data.length + ' Produk';
        tbody.innerHTML = '';
        data.forEach(p => {
          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td><img class="product-thumb" src="../${p.image}" alt=""></td>
            <td><strong>${p.name}</strong><br><small style="color:var(--ink-soft);">${p.desc.substring(0, 50)}...</small></td>
            <td><span class="badge-tag">${p.category}</span></td>
            <td><strong>Rp ${(p.price).toLocaleString('id-ID')}</strong></td>
            <td>${p.featured ? '⭐ Ya' : 'Tidak'}</td>
            <td><span style="color:#2E6F40; font-weight:700;">● Aktif</span></td>
          `;
          tbody.appendChild(tr);
        });
      } catch (e) {
        document.getElementById('product-tbody').innerHTML = '<tr><td colspan="6">Gagal memuat katalog.</td></tr>';
      }
    }
    loadProducts();
  </script>
</body>
</html>
